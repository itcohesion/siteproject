name: Store questionnaire responses

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  store-response:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'questionnaire-response') || startsWith(github.event.issue.title, '[questionnaire-response]')

    steps:
      - name: Parse issue body and store JSON
        uses: actions/github-script@v7
        with:
          script: |
            const zlib = require('node:zlib');
            const issue = context.payload.issue;
            const body = issue.body || '';
            const match = body.match(/^qr1:([A-Za-z0-9_-]+)\s*$/s);

            if (!match) {
              core.setFailed('Compressed payload not found in issue body.');
              return;
            }

            let payload;
            try {
              const compressed = Buffer.from(match[1], 'base64url');
              const json = zlib.gunzipSync(compressed).toString('utf8');
              payload = JSON.parse(json);
            } catch (error) {
              core.setFailed(`Unable to parse JSON payload: ${error.message}`);
              return;
            }

            const submittedAt = payload?.meta?.timestamp || new Date().toISOString();
            const datePart = submittedAt.slice(0, 10);
            const safeStamp = submittedAt.replaceAll(':', '-').replaceAll('.', '-');
            const fileName = `${safeStamp}-issue-${issue.number}.json`;
            const path = `responses/${datePart}/${fileName}`;
            const content = Buffer.from(JSON.stringify(payload, null, 2), 'utf8').toString('base64');

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `Add questionnaire response from issue #${issue.number}`,
              content,
              branch: context.payload.repository.default_branch,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Response saved to \`${path}\`.`,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
            });
